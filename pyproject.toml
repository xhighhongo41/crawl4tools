[project]
name = "crawl4tools"
version = "0.4.0"
description = "Web crawler server for Open WebUI and MCP, plus a local download CLI, built on crawl4ai"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "xhighhongo41" }]
keywords = ["crawler", "crawl4ai", "open-webui", "mcp", "markdown", "scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "crawl4ai[pdf]>=0.9.4,<0.10",
    "click>=8.1",
    "httpx>=0.27",
    "mcp>=2.2,<3",
    "pydantic>=2.12",
    "pyyaml>=6",
    "starlette>=1.7",
    "uvicorn>=0.53",
]

[project.scripts]
crawl4cli = "crawl4tools.cli.main:entry"
crawl4mcp = "crawl4tools.server.mcp_main:main"
crawl4server = "crawl4tools.server.server_main:main"

[project.urls]
Homepage = "https://github.com/xhighhongo41/crawl4tools"
Repository = "https://github.com/xhighhongo41/crawl4tools"
Issues = "https://github.com/xhighhongo41/crawl4tools/issues"
Changelog = "https://github.com/xhighhongo41/crawl4tools/blob/main/Changelog.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crawl4tools"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "types-PyYAML",
    "babel>=2.18",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "INT"]

[tool.mypy]
# numpy stubs (reached through pytest) use 3.12-only syntax; ruff keeps py311 syntax checks.
python_version = "3.12"
strict = true
warn_unused_ignores = true
mypy_path = "src"

[[tool.mypy.overrides]]
# crawl4ai does not ship type information.
module = ["crawl4ai", "crawl4ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs a real browser and network (set CRAWL4TOOLS_INTEGRATION=1)",
]
